<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Depth Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C29"/>
      <stop offset="50%" stop-color="#12131C"/>
      <stop offset="100%" stop-color="#0A0B10"/>
    </linearGradient>

    <!-- Joy-Con Left (Iconic Neon Red / Coral) -->
    <linearGradient id="joyconLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="50%" stop-color="#FA1E44"/>
      <stop offset="100%" stop-color="#D9042B"/>
    </linearGradient>

    <!-- Joy-Con Right (Iconic Neon Blue / Electric Cyan) -->
    <linearGradient id="joyconRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00C4FF"/>
      <stop offset="100%" stop-color="#0088EA"/>
    </linearGradient>

    <!-- Screen Bezel & Screen Base -->
    <linearGradient id="screenBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D313F"/>
      <stop offset="100%" stop-color="#1B1C24"/>
    </linearGradient>

    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1F2E"/>
      <stop offset="50%" stop-color="#141622"/>
      <stop offset="100%" stop-color="#0D0E17"/>
    </linearGradient>

    <!-- Golden Energy Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9A6"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="75%" stop-color="#FF9D00"/>
      <stop offset="100%" stop-color="#FF6A00"/>
    </linearGradient>

    <!-- Ambient Center Star Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#FF9800" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#FF5722" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Joy-Con Glows -->
    <radialGradient id="leftGlow" cx="20%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- High Impact Shadow Filter -->
    <filter id="consoleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="starGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Squircle Rounded Base (App Icon Standard 115px radius) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- Inner Edge Highlight Border -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Ambient Light Effects on Background -->
  <circle cx="120" cy="256" r="140" fill="url(#leftGlow)"/>
  <circle cx="392" cy="256" r="140" fill="url(#rightGlow)"/>
  <circle cx="256" cy="256" r="160" fill="url(#centerGlow)"/>

  <!-- 2. MAIN CONSOLE & CONTROLLER (Elevated by realistic 3D shadow) -->
  <g filter="url(#consoleShadow)">

    <!-- A. Center Tablet Screen Base -->
    <rect x="144" y="142" width="224" height="228" rx="20" fill="url(#screenBezel)"/>
    <!-- Screen Glass Display Area -->
    <rect x="154" y="152" width="204" height="208" rx="14" fill="url(#screenGlass)"/>

    <!-- Screen Glass Diagonal Reflection -->
    <path d="M154 152 L280 152 L154 278 Z" fill="rgba(255,255,255,0.05)"/>

    <!-- Glowing Energy Corona behind Star -->
    <circle cx="256" cy="256" r="78" fill="url(#centerGlow)"/>

    <!-- B. The Golden Energy Star -->
    <g filter="url(#starGlowFilter)">
      <path d="M256 178 
               L273 228 
               L326 228 
               L283 259 
               L300 310 
               L256 279 
               L212 310 
               L229 259 
               L186 228 
               L239 228 Z" 
            fill="url(#starGrad)" 
            stroke="#FFF9D2" 
            stroke-width="3.5"
            stroke-linejoin="round"/>
    </g>

    <!-- Star Victory Checkmark (Crisp, High Contrast) -->
    <path d="M235 254 L249 268 L278 238" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>


    <!-- C. Left Joy-Con (Neon Red) -->
    <!-- Joy-Con Body -->
    <path d="M138 142 
             H102 
             A48 48 0 0 0 54 190 
             V322 
             A48 48 0 0 0 102 370 
             H138 
             Z" 
          fill="url(#joyconLeft)"/>

    <!-- Top Highlight Edge -->
    <path d="M138 142 H102 A48 48 0 0 0 54 190 V198 A48 48 0 0 1 102 150 H138 Z" fill="rgba(255,255,255,0.32)"/>
    <!-- Left Outer Edge Rim Light -->
    <path d="M54 190 A48 48 0 0 0 102 370 H104 A48 48 0 0 1 56 322 V190 Z" fill="rgba(0,0,0,0.18)"/>

    <!-- Minus (-) Button -->
    <rect x="116" y="158" width="14" height="4.5" rx="2" fill="#181A24"/>

    <!-- Left Analog Stick -->
    <circle cx="96" cy="214" r="23" fill="#14151D"/>
    <circle cx="96" cy="214" r="18" fill="#282B38"/>
    <circle cx="96" cy="214" r="14.5" fill="#181A24"/>
    <circle cx="96" cy="214" r="5" fill="#3D4255"/>

    <!-- Left D-Pad (4 Direction Buttons) -->
    <g fill="#181A24">
      <circle cx="96" cy="284" r="6.5"/>  <!-- Up -->
      <circle cx="81" cy="299" r="6.5"/>  <!-- Left -->
      <circle cx="111" cy="299" r="6.5"/> <!-- Right -->
      <circle cx="96" cy="314" r="6.5"/>  <!-- Down -->
    </g>

    <!-- Left Capture Button (Square) -->
    <rect x="114" y="334" width="10" height="10" rx="2.5" fill="#181A24"/>


    <!-- D. Right Joy-Con (Neon Cyan) -->
    <!-- Joy-Con Body -->
    <path d="M374 142 
             H410 
             A48 48 0 0 1 458 190 
             V322 
             A48 48 0 0 1 410 370 
             H374 
             Z" 
          fill="url(#joyconRight)"/>

    <!-- Top Highlight Edge -->
    <path d="M374 142 H410 A48 48 0 0 1 458 190 V198 A48 48 0 0 0 410 150 H374 Z" fill="rgba(255,255,255,0.38)"/>
    <!-- Right Outer Edge Rim Light -->
    <path d="M458 190 A48 48 0 0 1 410 370 H408 A48 48 0 0 0 456 322 V190 Z" fill="rgba(0,0,0,0.18)"/>

    <!-- Plus (+) Button -->
    <path d="M382 159 H387.5 V153.5 H391.5 V159 H397 V163 H391.5 V168.5 H387.5 V163 H382 Z" fill="#181A24"/>

    <!-- Right Action Buttons (ABXY) -->
    <g fill="#181A24">
      <circle cx="416" cy="199" r="6.5"/>  <!-- X (Top) -->
      <circle cx="401" cy="214" r="6.5"/>  <!-- Y (Left) -->
      <circle cx="431" cy="214" r="6.5"/>  <!-- A (Right) -->
      <circle cx="416" cy="229" r="6.5"/>  <!-- B (Bottom) -->
    </g>

    <!-- Right Analog Stick -->
    <circle cx="416" cy="284" r="23" fill="#14151D"/>
    <circle cx="416" cy="284" r="18" fill="#282B38"/>
    <circle cx="416" cy="284" r="14.5" fill="#181A24"/>
    <circle cx="416" cy="284" r="5" fill="#3D4255"/>

    <!-- Right Home Button (Circle with Cyan Ring) -->
    <circle cx="388" cy="339" r="6.5" fill="#181A24" stroke="#00F0FF" stroke-width="1.8"/>
  </g>

  <!-- 3. Energy Warrior Sparkles (Subtle Gamified Accents) -->
  <!-- Top Right Golden Sparkle -->
  <path d="M434 78 Q434 98 454 98 Q434 98 434 118 Q434 98 414 98 Q434 98 434 78 Z" fill="#FFD700"/>
  <!-- Top Left Cyan Sparkle -->
  <path d="M78 86 Q78 100 92 100 Q78 100 78 114 Q78 100 64 100 Q78 100 78 86 Z" fill="#00F0FF"/>
  <!-- Bottom Right Red Sparkle -->
  <path d="M442 408 Q442 420 454 420 Q442 420 442 432 Q442 420 430 420 Q442 420 442 408 Z" fill="#FF385C"/>
  <!-- Small Golden Energy Orb -->
  <circle cx="82" cy="414" r="4.5" fill="#FFD700"/>
</svg>
