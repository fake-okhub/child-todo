name: Build Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Signed Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug and Release APKs
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare Artifacts
        run: |
          mkdir -p output-apks
          cp android/app/build/outputs/apk/release/app-release.apk output-apks/KidsTodo-Release-v1.0.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apks/KidsTodo-Debug-v1.0.0.apk
          ls -lh output-apks/

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsTodo-Release-APK
          path: output-apks/KidsTodo-Release-v1.0.0.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsTodo-Debug-APK
          path: output-apks/KidsTodo-Debug-v1.0.0.apk
          retention-days: 30
